name: Reconstitute the terminal

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: rbd-0110-regeneration
  cancel-in-progress: false

jobs:
  reconstitute:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile public signal into text
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/heartbeat.py --user robdroid0110
      - name: Persist verified output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md data/last_signal.json docs/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'terminal: reconstitute sampled signal'
            git push
          fi

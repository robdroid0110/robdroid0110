name: Reconstitute the anomaly

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: rbd-0110-regeneration
  cancel-in-progress: false

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Synthesize field / no third-party runtime
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/synthesize.py --user robdroid0110
      - name: Persist the observable frame
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/cover.svg assets/manifest.svg assets/telemetry.svg data/last_signal.json
          if ! git diff --cached --quiet; then
            git commit -m 'anomaly: regenerate public-signal morphology'
            git push
          fi
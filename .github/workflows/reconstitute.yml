name: Reconstitute organism

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: reconstitute-organism
  cancel-in-progress: false

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout specimen
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Construct image from public events
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/synthesize.py --user robdroid0110

      - name: Persist new morphology
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/organism.svg
          if [ -f data/last_signal.json ]; then
            git add -- data/last_signal.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'specimen: reconstitute public signal'
            git push
          fi